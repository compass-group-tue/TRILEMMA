<script>
const {esc, av, name, rename, LABEL} = T;
T.nav(); T.theme(document.getElementById('theme'));
const IDX = window.TRILEMMA_INDEX;
const FOCAL = ['Priya','Nadia'];
const SPRINT = '#sep-2026-sprint';
let R = null, state = {view:'timeline', convs:[SPRINT], agent:'Priya', filter:null, validOnly:false, warmup:false, setting:'main'};
const setOf = k => IDX.settings.find(s => s.key === k) || IDX.settings[0];
const AGENTS = () => R ? R.agents : ['Priya','Nadia','Matthieu','Rafael','Helena'];
const colorOf = a => `var(${T.COLOR[a] || '--other'})`;
// deep links: runs of `main` keep their short form (#dspro_s6); all others are #<setting>/<run>
const hashId = id => id.startsWith('main/') ? id.slice(5) : id;

/* ── routing ── */
function parseHash() {
  const [id0, ...kv] = location.hash.slice(1).split('&');
  const o = Object.fromEntries(kv.map(x => x.split('=')));
  let id = decodeURIComponent(id0 || 'dspro_s6');
  if (!id.includes('/')) id = 'main/' + id;
  return {...o, id};
}

/* ── timeline: one lane per agent ── */

  } else {
    const bucket = t => Math.floor(t / 60);
    const rows = {}, put = (b, k, html) => { if (html) ((rows[b] ??= {})[k] ??= []).push(html); };
    const first = lanes.includes(SPRINT) ? SPRINT : lanes.find(k => !isPriv(k)) || lanes[0];
    let hist = {};
    for (const k of lanes) {
      if (isPriv(k)) { for (const t of d.turns.filter(t => t.agent === k.slice(5))) put(bucket(t.t), k, privCard(t)); continue; }
      for (const m of d.msgs.filter(m => m.conv === k)) m.live ? put(bucket(m.t), k, msgHTML(m, shown, lastOfTurn)) : (hist[k] ??= []).push(msgHTML(m, shown, lastOfTurn));
    }
    for (const t of orphans) put(bucket(t.t), first, turnRowHTML(t, shown));
    const from = state.warmup ? -Infinity : Math.floor((d.kickoff - 300) / 60);
    const keys = Object.keys(rows).map(Number).filter(b => b >= from).sort((a, b) => a - b);
    const base = new Date('2000-01-01T' + d.clock_start + 'Z').getTime();
    const clk = b => new Date(base + b * 60000).toISOString().slice(11, 16);
    let h = `<div class="bdgrid mgrid" style="grid-template-columns:56px ${lanes.map(k => isPriv(k) ? 'minmax(260px,300px)' : k === SPRINT ? 'minmax(360px,440px)' : 'minmax(300px,360px)').join(' ')}">`;
    h += '<div class="ch tc">time</div>' + lanes.map(k => `<div class="ch">${isPriv(k) ? av(k.slice(5), 1) : ''}${esc(laneName(k))}<button class="closebtn" data-add="${esc(k)}" title="remove column">✕</button></div>`).join('');
    if (Object.keys(hist).length) h += '<div class="tc">before</div>' + lanes.map(k => `<div class="cell">${(hist[k] || []).length ? `<details class="more"><summary>${hist[k].length} messages before the run</summary>${hist[k].join('')}</details>` : ''}</div>`).join('');
    let shownK = false, shownD = false;
    for (const b of keys) {
      if (!shownK && b * 60 >= d.kickoff) { shownK = true; h += `<div class="mkrow">${clk(Math.floor(d.kickoff / 60))} board opens</div>`; }
      if (!shownD && b * 60 >= d.deadline) { shownD = true; h += `<div class="mkrow">${clk(Math.floor(d.deadline / 60))} board locks</div>`; }
      h += `<div class="tc">${clk(b)}</div>` + lanes.map(k => `<div class="cell">${(rows[b][k] || []).join('')}</div>`).join('');
    }
    content = `<div class="stream multi"><label class="fine warm"><input type="checkbox" id="warm" ${state.warmup ? 'checked' : ''}> show the warm-up before 09:25 (agents reading Slack before their users ask)</label>${h}</div></div>`;
  }
  v.innerHTML = `<div class="panel chat"><div class="convs">${list}</div>${content}<div class="minimap" title=""></div></div>`;
  buildMinimap(v, lanes);
  const redraw = () => { drawChat(v, hint); };
  v.querySelector('.convs').onclick = e => {
    const p = e.target.closest('[data-preset]'), a = e.target.closest('[data-add]'), c = e.target.closest('[data-c]');
    if (p) state.convs = p.dataset.preset === 'board' ? boardPreset() : [SPRINT];
    else if (a) { const k = a.dataset.add; state.convs = shown.has(k) ? lanes.filter(x => x !== k) : [...lanes, k]; }
    else if (c) state.convs = [c.dataset.c];
    else return;
    redraw();
  };
  const w = v.querySelector('#warm'); if (w) w.onchange = e => { state.warmup = e.target.checked; redraw(); };
  v.querySelector('.stream').onclick = e => {
    const x = e.target.closest('[data-add]');
    if (x) { state.convs = lanes.filter(k => k !== x.dataset.add); return redraw(); }
    const o = e.target.closest('[data-open]');
    if (o) { e.preventDefault(); return jumpTo('msg:' + o.dataset.open); }
    const c = e.target.closest('[data-close]');
    if (c) { const host = c.closest('.msg > div'), box = host.querySelector('.think'), tb = host.querySelector('[data-think]');
      box.remove(); mmRedraw && mmRedraw(); if (tb) { tb.setAttribute('aria-pressed', 'false'); if (c.dataset.close === 'bottom') host.closest('.msg').scrollIntoView({block:'nearest', behavior:'smooth'}); } return; }
    const b = e.target.closest('[data-think]'); if (!b) return;
    const host = b.closest('.msg > div'); const ex = host.querySelector('.think');
    if (ex) { ex.remove(); b.setAttribute('aria-pressed', 'false'); mmRedraw && mmRedraw(); return; }
    b.setAttribute('aria-pressed', 'true');
    const t = R.turnById[b.dataset.think];
    host.insertAdjacentHTML('beforeend', `<div class="think"><header>${av(t.agent, 1)} ${esc(name(t.agent))}’s agent · turn at ${t.time} <a class="go" style="margin-left:auto" href="#" data-jump="turn:${b.dataset.think}">full turn →</a><button class="closebtn" data-close="top" title="Close">✕</button></header>${turnBody(t, true)}<footer><button class="closebtn" data-close="bottom">▲ close</button></footer></div>`);
    mmRedraw && mmRedraw();
  };
  v.querySelector('.stream').addEventListener('toggle', () => mmRedraw && mmRedraw(), true);
}
function cotSpans(t) {
  if (!FOCAL.includes(t.agent)) return [];
  const dd = (R.seats[t.agent] || {}).deception || {};
  const a = dd['ack-fabr'] || dd['ack-fram'] || [];
  return a.filter(x => x.turn === t.i && x.cot_quote).map(x => ({q:x.cot_quote, cls:'cot', title:'CoT acknowledgment quoted by the judge'}));
}
function turnBody(t, clamp) {
  const sp = cotSpans(t);
  return t.steps.map((st, i) => {
    const calls = t.calls.filter(c => c.step === i + 1 || (!c.step && i === 0));
    const long = (st.reasoning || '').length > 700;
    return `<div class="step">${st.reasoning ? `<div class="r ${clamp && long && !sp.length ? 'clamp' : ''}">${markSpans(st.reasoning.trim(), sp)}</div>${clamp && long && !sp.length ? '<button class="more" onclick="this.previousElementSibling.classList.remove(\'clamp\');this.remove()">show all</button>' : ''}` : ''}
      ${calls.map(c => `<div class="call"><span class="fine">${esc(c.clock)}</span><span class="tn">${esc(rename(c.line))}</span>${c.text ? `<div class="posted">${esc(rename(c.text))}</div>` : ''}<details data-r="${c.r}"><summary class="fine">args / result</summary><pre>${esc(rename(JSON.stringify(c.args, null, 1)))}</pre><pre class="respre">loading result…</pre></details></div>`).join('')}
      ${st.text && st.text.trim() ? `<div class="touser">to ${esc(name(t.agent))}: ${esc(rename(st.text.trim()))}</div>` : ''}</div>`;
  }).join('') || (t.calls.length ? `<div class="step">${t.calls.map(c => `<div class="call"><span class="tn">${esc(rename(c.line))}</span></div>`).join('')}</div>` : '<div class="step fine">no reasoning recorded</div>');
}

/* ── agent log ── */
function drawAgent(v, hint) {
  hint.textContent = R.closed ? 'Closed-weight models return a reasoning summary, not the raw chain of thought.' : 'Full turns: reasoning, tool calls, and private notes to the user.';
  const ts = R.turns.filter(t => t.agent === state.agent);
  const quiet = t => !t.steps.some(s => s.reasoning) && !t.calls.length;
  v.innerHTML = `<div class="panel al"><div class="agpick">${AGENTS().map(a => `<button data-a="${a}" aria-pressed="${a === state.agent}">${av(a, 1)}${esc(name(a))}</button>`).join('')}</div>
    <p class="fine" style="margin:0 0 10px">${esc(name(state.agent))}’s agent · ${esc(T.ROLE[state.agent] || R.roles[state.agent] || '')} · ${ts.length} turns</p>
    ${ts.filter(t => !quiet(t)).map(t => `<div class="turnbox" id="t-${t.i}"><header><span class="t">${t.time}</span><span>${t.wake ? 'woken by ' + esc(convName(t.wake)) + (t.wake_from ? ' · ' + esc(name(t.wake_from)) : '') : esc(t.kind)}</span><span style="margin-left:auto">${t.calls.length} tool calls</span></header>${turnBody(t, true)}</div>`).join('')}</div>`;
  v.querySelector('.agpick').onclick = e => { const b = e.target.closest('button'); if (b) { state.agent = b.dataset.a; drawAgent(v, hint); } };
}
/* ── prompts ── */
function drawSetup(v, hint) {
  hint.textContent = 'What each agent was told: its system prompt and the request from its user.';
  const sp = R.system_prompts || {};
  v.innerHTML = `<div class="panel al">${AGENTS().map((a, i) => `<h3 style="margin:${i ? 22 : 0}px 0 8px;display:flex;gap:6px;align-items:center">${av(a, 1)} ${esc(name(a))}’s agent</h3>
      <div class="prompt">${esc(rename(R.asks[a] || '—'))}</div>
      <details style="margin-top:6px"${i === 0 ? ' open' : ''}><summary class="fine" style="cursor:pointer">system prompt</summary><div class="prompt" style="margin-top:6px">${esc(rename(sp[a] || ''))}</div></details>`).join('')}</div>`;
}

document.getElementById('main').addEventListener('toggle', e => {
  const dt = e.target; if (!dt.matches || !dt.matches('details[data-r]') || !dt.open) return;
  const pre = dt.querySelector('.respre'); if (!pre || pre.dataset.done) return;
  const run = R;
  T.loadResults(run).then(res => { pre.textContent = rename(JSON.stringify(res[+dt.dataset.r], null, 1)); pre.dataset.done = 1; })
    .catch(() => { pre.textContent = 'result not available'; });
}, true);
T.namesToggle(document.getElementById('names'), () => { drawSide(); if (R) { R.convList = convList(R); drawRun(); } });
drawSide();
const h0 = parseHash();
open(h0.id, {...(h0.view ? {view:h0.view} : {}), ...(h0.turn ? {jump:'turn:' + h0.turn} : h0.msg ? {jump:'msg:' + decodeURIComponent(h0.msg)} : {})});
</script>
</body></html>
